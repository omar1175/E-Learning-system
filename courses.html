<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Courses - E-Learning</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/courses.css" />
  </head>
  <body>
    <!-- ================= header ================= -->
    <header class="site-header">
      <div class="container navbar">
        <a href="index.html" class="logo">E-Learning</a>

        <nav class="nav-links">
          <a href="index.html">Home</a>
          <a href="courses.html" class="active">Courses</a>
          <a href="about.html">About</a>
          <a href="contact.html">Contact</a>
        </nav>

        <div class="auth-links" id="authLinks">
          <a href="auth.html">Login</a>
          <a href="auth.html" class="btn btn-primary">Sign Up</a>
        </div>
      </div>
    </header>

    <!-- ================= main content ================= -->
    <main>
      
      <section class="courses-header">
        <div class="container">
          <h1>All Courses</h1>
          <p>Browse through our wide range of online courses.</p>

          
          <div class="filters">
            <input type="text" placeholder="Search courses..." / id="searchInput">
            <select id="categoryFilter">
              <option value="">All Categories</option>
              <option value="programming">Programming</option>
              <option value="webdesign">Web Design</option>
              <option value="python">Python</option>
            </select>
          </div>
        </div>
      </section>
      <!-- course grid -->
      <section class="container section">
        <h1>All Courses</h1>

        <!--  dynamic container  -->
        <div class="courses-grid" id="coursesGrid"></div>
      </section>
    </main>

    <!-- ================= footer================= -->
    <footer>
      <p>© 2026 E-Learning Platform. All rights reserved.</p>
    </footer>
    <script src="js/courses.js"></script>
        <script src="js/main.js"></script>

  </body>
