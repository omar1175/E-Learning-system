<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Contact Us - E-Learning</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/contact.css" />
  </head>
  <body>
    <!-- ================= HEADER ================= -->
    <header class="site-header">
      <div class="container navbar">
        <a href="index.html" class="logo">E-Learning</a>
        <nav class="nav-links">
          <a href="index.html">Home</a>
          <a href="courses.html">Courses</a>
          <a href="about.html">About</a>
          <a href="contact.html" class="active">Contact</a>
        </nav>
        <div class="auth-links" id="authLinks">
          <a href="auth.html#registerForm" id="loginBtn">Login</a>
          <a href="auth.html#loginForm" id="registerBtn" class="btn btn-primary"
            >Sign Up</a
          >
        </div>
      </div>
    </header>

    <!-- ================= MAIN ================= -->
    <main class="section container">
      <h1 class="text-center">Contact Us</h1>
      <p class="text-center">Have questions? We'd love to hear from you!</p>
      <div class="contact-container">
        <!-- Contact Form -->
        <form id="contactForm" class="contact-form">
          <div class="input-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" required />
          </div>
          <div class="input-group">
            <label for="email">Email</label>
            <input type="email" id="email" required />
          </div>
          <div class="input-group">
            <label for="message">Message</label>
            <textarea id="message" rows="5" required></textarea>
          </div>
          <button type="submit" class="btn btn-primary">Send Message</button>
        </form>

        <!-- Contact Info -->
        <div class="contact-info">
          <h3>Get in touch</h3>
          <p>Email: omarabdelstar2002@gmail.com</p>
          <p>Phone: +20 114 836 7314</p>
          <p>Address: ITI, Mynia, Egypt</p>
        </div>
      </div>
    </main>

    <!-- ================= FOOTER ================= -->
    <footer>
      <p>© 2026 E-Learning Platform. All rights reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script>
      (function () {
        emailjs.init({
          publicKey: "PZxPtA7s5MM4PIlGx",
        });
        console.log("EmailJS initialized successfully");
      })();
    </script>

    <script src="js/main.js"></script>
    <script src="js/contact.js"></script>
  </body>
</html>
